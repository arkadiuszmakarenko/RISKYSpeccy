name: Build Firmware

on:
  push:
    branches: [ main, master, v0.2 ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master, v0.2 ] 
  release:
    types: [ created, published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build RISKYZXSpectrum firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0

      - name: Cache apt package downloads
        id: cache-apt
        uses: actions/cache@v4.2.0
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt
          # Invalidate when the apt package list itself changes.
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install system dependencies
        if: steps.cache-apt.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            wget \
            xz-utils \
            tar \
            sdcc \
            binutils

      - name: Ensure system dependencies (cache hit path)
        if: steps.cache-apt.outputs.cache-hit == 'true'
        # On a cache hit, the .deb files are already on disk, but the
        # packages may not yet be installed on a *fresh* VM.  Re-install
        # with --no-download to use only the cached debs.
        run: |
          sudo apt-get update -o Dir::Cache::Archives=/var/cache/apt/archives
          sudo apt-get install -y --no-download \
            build-essential \
            make \
            wget \
            xz-utils \
            tar \
            sdcc \
            binutils || {
            # Fallback: cache hit on archives but they're stale or
            # partial.  Force a refresh.
            echo "Cached apt install failed; refreshing..."
            sudo apt-get update
            sudo apt-get install -y \
              build-essential \
              make \
              wget \
              xz-utils \
              tar \
              sdcc \
              binutils
          }

      - name: Cache WCH RISC-V toolchain
        id: cache-toolchain
        uses: actions/cache@v4.2.0
        with:
          # Cache BOTH the extracted tree and the symlink we create on top.
          path: |
            /opt/riscv-toolchain
            /opt/wch-toolchain
          key: wch-toolchain-v210-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            wch-toolchain-v210-${{ runner.os }}-

      - name: Download and extract WCH RISC-V toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss — downloading toolchain..."
          wget -q --show-progress \
            https://github.com/arkadiuszmakarenko/WCHToolchain/releases/download/ToolchainV210/MRS_Toolchain_Linux_x64_V210.tar.xz \
            -O /tmp/toolchain.tar.xz

          echo "Extracting toolchain to /opt/riscv-toolchain..."
          sudo mkdir -p /opt/riscv-toolchain
          sudo tar -xf /tmp/toolchain.tar.xz -C /opt/riscv-toolchain
          rm /tmp/toolchain.tar.xz

          echo "✓ Toolchain installed."

      - name: Locate WCH RISC-V toolchain
        id: toolchain
        run: |
          # The archive extracts WITHOUT a top-level wrapper directory, so
          # the bin/ subdir lives directly under the extraction root.  We
          # need the variant that ships the WCH-specific `riscv-wch-elf-`
          # toolchain prefix (the Makefile's TOOL_PREFIX), which is the
          # "RISC-V Embedded GCC12" directory.
          set -e
          EXTRACT_ROOT="/opt/riscv-toolchain"

          GCC_ROOT=""
          for candidate in \
              "$EXTRACT_ROOT/RISC-V Embedded GCC12" \
              "$EXTRACT_ROOT/RISC-V Embedded GCC"; do
            if [ -x "$candidate/bin/riscv-wch-elf-gcc" ]; then
              GCC_ROOT="$candidate"
              break
            fi
          done

          if [ -z "$GCC_ROOT" ]; then
            echo "ERROR: Could not find a WCH RISC-V toolchain under $EXTRACT_ROOT"
            echo "Top-level contents:"
            ls -la "$EXTRACT_ROOT"
            echo "Searched for bin/riscv-wch-elf-gcc, found:"
            find "$EXTRACT_ROOT" -maxdepth 4 -name 'riscv-wch-elf-gcc' || true
            exit 1
          fi

          echo "✓ Toolchain located at: $GCC_ROOT"

          # The extracted directory contains a SPACE in its name
          # ("RISC-V Embedded GCC12"), and the Makefile's CC/OBJCOPY/etc.
          # variables expand TOOLCHAIN_DIR with no quoting, which makes
          # /bin/sh tokenize the path on whitespace.  Replace it with a
          # symlink under a space-free path so the build can use the path
          # without any quoting tricks.  This step is idempotent — both
          # directories are also covered by actions/cache, so on a cache
          # hit the symlink is restored as-is.
          SAFE_ROOT="/opt/wch-toolchain"
          sudo mkdir -p "$SAFE_ROOT"
          sudo ln -sfn "$GCC_ROOT" "$SAFE_ROOT/wch"
          SAFE_GCC_ROOT="$SAFE_ROOT/wch"

          echo "✓ Symlinked: $SAFE_GCC_ROOT -> $GCC_ROOT"
          echo "TOOLCHAIN_DIR=$SAFE_GCC_ROOT" >> "$GITHUB_OUTPUT"

          "$SAFE_GCC_ROOT/bin/riscv-wch-elf-gcc" --version
          echo "✓ Toolchain verified"

      - name: Cache build directory
        id: cache-build
        uses: actions/cache@v4.2.0
        with:
          path: build
          # Per-commit cache so a feature branch shares state with the
          # commit it forked from via the restore-keys fallback.
          key: build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Build firmware
        env:
          TOOLCHAIN_DIR: ${{ steps.toolchain.outputs.TOOLCHAIN_DIR }}
        run: |
          echo "Using TOOLCHAIN_DIR=$TOOLCHAIN_DIR"
          echo "Building all firmware variants..."
          make TOOLCHAIN_DIR="$TOOLCHAIN_DIR"

          echo "Built artifacts:"
          make versions

      - name: Verify build artifacts
        run: |
          echo "Verifying firmware builds..."

          # Flash layout (CH32V303 with SRAM_CODE_MODE=0, from the linker
          # scripts under firmware/Ld/ and Bootloader/Ld/):
          #   0x00000000..0x00004000  16 KB   bootloader region
          #   0x00004000..0x00030000 176 KB   app region (RISKYZXS.UPD)
          #   0x00000000..0x00030000 192 KB   standalone (RISKYSpeccy.bin)
          BOOT_MAX=$((16 * 1024))           # 16384
          APP_MAX=$((176 * 1024))           # 180224
          STANDALONE_MAX=$((192 * 1024))    # 196608
          COMBINED_OFFSET=$BOOT_MAX

          # Individual firmware binaries
          if [ ! -f "build/bootloader/Bootloader.bin" ]; then
            echo "ERROR: build/bootloader/Bootloader.bin not found"
            exit 1
          fi
          echo "✓ Bootloader.bin found"

          if [ ! -f "build/RISKYSpeccy.bin" ]; then
            echo "ERROR: build/RISKYSpeccy.bin not found"
            exit 1
          fi
          echo "✓ RISKYSpeccy.bin found"

          if [ ! -f "build/RISKYZXS.UPD" ]; then
            echo "ERROR: build/RISKYZXS.UPD not found"
            exit 1
          fi
          echo "✓ RISKYZXS.UPD found"

          if [ ! -f "build/RISKYZXS_COMBINED.bin" ]; then
            echo "ERROR: build/RISKYZXS_COMBINED.bin not found"
            exit 1
          fi
          echo "✓ RISKYZXS_COMBINED.bin found"

          echo ""
          echo "Checking binary sizes..."

          size_boot=$(stat -c%s "build/bootloader/Bootloader.bin")
          size_app=$(stat -c%s "build/RISKYZXS.UPD")
          size_combined=$(stat -c%s "build/RISKYZXS_COMBINED.bin")
          size_standalone=$(stat -c%s "build/RISKYSpeccy.bin")

          echo "Bootloader size:         $size_boot bytes (max $BOOT_MAX bytes — 16KB region at 0x00000000..0x00004000)"
          echo "RISKYZXS.UPD size:       $size_app bytes (max $APP_MAX bytes — 176KB region at 0x00004000..0x00030000)"
          echo "RISKYSpeccy.bin size:    $size_standalone bytes (max $STANDALONE_MAX bytes — 192KB standalone)"
          echo "Combined size:           $size_combined bytes (expected $((COMBINED_OFFSET + size_app)) bytes = 16KB pad + app)"

          # Bootloader must fit in the 16KB region at flash base.
          if [ "$size_boot" -gt $BOOT_MAX ]; then
            echo "ERROR: Bootloader exceeds 16KB region"
            exit 1
          fi

          # App-update must fit in the 176KB region starting at 0x4000.
          if [ "$size_app" -gt $APP_MAX ]; then
            echo "ERROR: RISKYZXS.UPD exceeds available app region (${APP_MAX} bytes)"
            exit 1
          fi

          # Standalone image must fit in the full 192KB flash.
          if [ "$size_standalone" -gt $STANDALONE_MAX ]; then
            echo "ERROR: RISKYSpeccy.bin exceeds standalone flash region (${STANDALONE_MAX} bytes)"
            exit 1
          fi

          # Combined image is bootloader padded to 16KB then app appended;
          # its size must equal exactly COMBINED_OFFSET + app size.
          expected_combined=$((COMBINED_OFFSET + size_app))
          if [ "$size_combined" -ne $expected_combined ]; then
            echo "ERROR: Combined binary size mismatch (expected $expected_combined, got $size_combined)"
            exit 1
          fi

          echo "✓ All size checks passed"

      - name: List build artifacts
        run: |
          echo "Build artifacts summary:"
          echo "========================"
          find build -type f \( -name "*.bin" -o -name "*.UPD" -o -name "*.elf" -o -name "*.hex" \) -exec ls -lh {} \;

      - name: Upload combined release artifacts
        uses: actions/upload-artifact@v4.4.0
        with:
          name: RISKYZXSpectrum-firmware
          path: |
            build/RISKYZXS_COMBINED.bin
            build/RISKYZXS.UPD
            build/RISKYSpeccy.bin
            build/bootloader/Bootloader.bin
          if-no-files-found: error
          retention-days: 90

      - name: Upload logs and listings
        if: always()
        uses: actions/upload-artifact@v4.4.0
        with:
          name: RISKYZXSpectrum-build-logs
          # upload-artifact v4 resolves globs relative to GITHUB_WORKSPACE and
          # computes the common directory prefix across all patterns. When two
          # patterns (`build/**/*.lst` and `build/**/*.siz`) are listed
          # separately, the prefix logic can drop the match.  Using a single
          # combined pattern with brace expansion avoids this; pairing it with
          # the leading-`build/` anchor keeps the upload scoped.
          path: build/**/*.{lst,siz}
          if-no-files-found: ignore
          retention-days: 30

      - name: Create or update GitHub Release assets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the tag name for tag pushes, otherwise use "latest".
          #
          # IMPORTANT: do NOT pass --prerelease for the rolling "latest"
          # release.  GitHub only auto-marks a release as the project's
          # "Latest" badge when it is *not* a prerelease, so passing
          # --prerelease here would leave the badge stuck on the most
          # recent tag-based (stable) release forever, even though we are
          # actively overwriting the "latest" tag's assets below.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            PRERELEASE=""
            TITLE="${TAG}"
          else
            TAG="latest"
            PRERELEASE=""
            TITLE="Latest build ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          fi

          # Collect release assets: top-level *.bin / *.UPD plus the standalone
          # bootloader image.  We use a NUL-separated find + sort -z so paths
          # with spaces (none today, but cheap to be safe) and any future
          # bootloader subdir layout are handled cleanly.  Intermediate
          # listings (.lst/.siz/.map) still go to the workflow artifact, not
          # the release.
          FILES=()
          while IFS= read -r -d '' file; do
            FILES+=("$file")
          done < <(find build -type f \
              \( -name "*.bin" -o -name "*.UPD" \) \
              ! -path "build/app_*/*" \
              ! -path "build/*/Core/*" \
              ! -path "build/*/Debug/*" \
              ! -path "build/*/Peripheral/*" \
              ! -path "build/*/Startup/*" \
              ! -path "build/*/User/*" \
              ! -path "build/zx_src/*" \
              ! -name "*.hex" ! -name "*.elf" ! -name "*.map" \
              -print0 | sort -z)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "ERROR: No release assets found in build/"
            exit 1
          fi

          echo "Release assets:"
          printf ' - %s\n' "${FILES[@]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Updating assets..."
            gh release edit "$TAG" --title "$TITLE" $PRERELEASE
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" "${FILES[@]}" \
              --title "$TITLE" \
              --generate-notes \
              $PRERELEASE
          fi

          # Migration helper: if a previous run created the "latest"
          # release with --prerelease, the "Latest" badge on the
          # repository's Releases page will stay pinned to whatever the
          # most recent tag-based release is.  Clear the prerelease flag
          # on "latest" so GitHub considers it the current Latest
          # release.  This is idempotent: running it on an already-stable
          # release is a no-op.
          if [[ "$TAG" == "latest" ]]; then
            echo "Ensuring '$TAG' is not marked as a prerelease..."
            gh release edit "$TAG" --prerelease=false || true
          fi